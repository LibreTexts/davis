name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  pr-checks:
    name: Run PR Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library packages in dependency order
        run: npm run build:packages

      - name: Run typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Build documentation
        run: npm run docs:build

      - name: Check type declarations are published
        run: node scripts/check-dist-types.mjs

      - name: Run tests
        run: npm run test --workspaces --if-present

      - name: Run lint
        run: npm run lint --workspaces --if-present
